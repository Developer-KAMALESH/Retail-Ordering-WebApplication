<div class="register-container">
  <div class="card">
    <h2>Create Account</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="fullName" placeholder="Enter your name" />
       <small *ngIf="submitted && registerForm.get('fullName')?.errors">
          Name must be at least 3 characters
        </small>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="Enter your email" />
       <small *ngIf="submitted && registerForm.get('email')?.errors">
  Enter a valid email
</small>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Enter password" />
        <small *ngIf="submitted &&registerForm.get('password')?.errors">
          Password must be at least 6 characters
        </small>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="confirmPassword" placeholder="Confirm password" />
        <small *ngIf="submitted && (registerForm.get('confirmPassword')?.errors || registerForm.errors?.['passwordMismatch'])">
  Passwords do not match
</small>
      </div>

      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a routerLink="/login">Login here</a></p>
  </div>
</div>
